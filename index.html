<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open App</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f2f2f2;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .deep-link {
      display: inline-block;
      font-size: 5vw;
      padding: 2rem 4rem;
      min-width: 240px;
      min-height: 100px;
      background: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 1rem;
    }

    .deep-link:hover { background: #45a049; }

    .info {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <p>Open ElandCloud App</p>
  <a id="deepLink" class="deep-link" href="#">Open App</a>
  <div class="info" id="info"></div>

  <script>
    // Strip leading "/link/" so path = "open/{encrypted_id}" (no leading slash)
    const path  = window.location.pathname.replace(/^\/link\//, "");
    const query = window.location.search;

    // Custom scheme URL works for both iOS and sideloaded Android
    const customURL = `elandcloud://${path}${query}`;

    const ua        = navigator.userAgent;
    const isAndroid = /Android/i.test(ua);
    const isIOS     = /iPhone|iPad|iPod/i.test(ua);

    const info     = document.getElementById("info");
    const deepLink = document.getElementById("deepLink");

    if (isAndroid) {
      info.textContent = "Detected Android — tap the button to open";

      // Use custom scheme directly: Android OS resolves this to the installed app
      // via its registered intent filter, bypassing Chrome's package visibility check.
      deepLink.href = customURL;

    } else if (isIOS) {
      info.textContent = "Detected iOS";

      deepLink.href = customURL;

      setTimeout(() => {
        window.location.href = customURL;
      }, 100);

    } else {
      info.textContent = "Desktop / Unsupported";
      deepLink.href = "#";
    }
  </script>

</body>
</html>
